[build-system]
requires = ["scikit-build-core>=0.11", "setuptools-scm>=8", "Cython>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "daggerml-cli"
dynamic = ["version"]
authors = [
  { name = "Micha Niskin", email = "micha.niskin@gmail.com" },
]
description = "DaggerML's cli backend"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
classifiers = [
  "Operating System :: OS Independent",
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
    "typing-extensions>=4.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
table = [
    "tabulate",
    "asciidag",
]
s3 = [
    "boto3",
]
dev = [
    "hypothesis>=6.141.1",
    "moto[all,server]>=5.1.20",
    "pytest>=8.4.2",
    "ruff>=0.14.10",
]

[project.scripts]
dml = "daggerml_cli._cli:cli"
dml-python-fork-adapter = "daggerml_cli.python_fork_adapter:main"

[project.urls]
Homepage = "https://daggerml.com"
Documentation = "https://daggerml.com"
Issues = "https://github.com/daggerml/daggerml-cli/issues"
Source = "https://github.com/daggerml/daggerml-cli"

[tool.scikit-build]
wheel.packages = ["src/daggerml_cli"]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = ["src/daggerml_cli/__about__.py"]

[tool.setuptools_scm]
write_to = "src/daggerml_cli/__about__.py"
tag_regex = "^v(?P<version>[0-9]+(?:\\.[0-9]+)*[a-zA-Z0-9\\.\\-]*)$"

[[tool.scikit-build.generate]]
path = "daggerml_cli/__about__.py"
location = "install"
template = "__version__ = \"${version}\"\n"


[tool.pytest.ini_options]
pythonpath = "tests/"
minversion = "6.0"
addopts = "-ra --ignore=submodules/"
testpaths = [
  "tests",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "serial",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "I", "PGH004", "W"]
ignore = []
unfixable = ["B"]

[tool.ruff.lint.isort]
known-first-party = ["daggerml_cli"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"src/daggerml_cli/__init__.py" = ["F401", "E402"]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252"]

[tool.coverage.run]
source_pkgs = ["daggerml_cli"]
branch = true
parallel = true
omit = [
  "src/daggerml_cli/__init__.py",
]

[tool.coverage.paths]
daggerml_cli = ["src/daggerml_cli", "*/daggerml-cli/src/daggerml_cli"]
tests = ["tests", "*/daggerml-cli/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.pyright]
include = ["src"]
defineConstant = { DEBUG = true }
typeCheckingMode = "basic"
reportGeneralTypeIssues = false
reportMissingImports = "error"
reportMissingTypeStubs = false
reportOptionalCall = false
reportOptionalMemberAccess = false
